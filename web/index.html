<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadanie 4 - Serwer HTTP Docker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #1d63ed;
        }
        p {
            color: #555;
            font-size: 16px;
        }
        .badge {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Witaj ze skonteneryzowanego serwera HTTP!</h1>
        <p>Aplikacja działa poprawnie wewnątrz kontenera Docker przy użyciu modułu <code>python -m http.server</code>.</p>
        <div class="badge">Status: Serwer działa (Port 8000)</div>
    </div>

</html>
